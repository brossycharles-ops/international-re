# Free uptime watchdog (runs on GitHub, uses no Claude usage).
# Every 30 minutes it loads the homepage, the status API and a city guide. If any
# still fails after a 2-minute retry (deploys cause about a minute of 502s), it opens
# a "Site down" issue, which GitHub emails to the repo owner, and closes it when
# the site is back.
name: Uptime watchdog
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the live site
        id: probe
        run: |
          urls="https://www.internationalre.org/ https://www.internationalre.org/api/status https://www.internationalre.org/cities/lima-peru/"
          probe() { bad=""; for u in $urls; do c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u"); [ "$c" = 200 ] || bad="$bad $u ($c)"; done; echo "$bad"; }
          bad=$(probe)
          if [ -n "$bad" ]; then sleep 120; bad=$(probe); fi
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
          echo "failing:${bad:- none}"
      - name: Open or close the "Site down" issue
        uses: actions/github-script@v7
        env:
          BAD: ${{ steps.probe.outputs.bad }}
        with:
          script: |
            const bad = (process.env.BAD || '').trim();
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'site-down' })).data;
            if (bad && !open.length) {
              await github.rest.issues.create({ owner, repo, title: 'Site down: internationalre.org is not responding', labels: ['site-down'],
                body: `The uptime watchdog could not load these pages twice, 2 minutes apart:\n\n${bad}\n\nCheck Railway (deployments and logs) and Cloudflare. This issue closes itself when the site is back.` });
            } else if (!bad && open.length) {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'Back up: all checked pages return 200.' });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
            }
